<style>
:root{--bg:#05070c;--surface:#0a0e16;--surface2:#0e1420;--surface3:#121a28;--line:rgba(255,255,255,.09);--line2:rgba(110,145,255,.28);--text:#f7f9fc;--muted:#97a2b5;--accent:#6e91ff;--accent2:#8e6cff;--cyan:#43d8ff;--green:#2ee6a6;--danger:#ff647c;--radius:18px;--shadow:0 24px 80px rgba(0,0,0,.34)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 480px at 12% -10%,rgba(61,106,255,.16),transparent 60%),radial-gradient(700px 420px at 92% 6%,rgba(142,108,255,.13),transparent 62%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}.container,.shell{width:min(1240px,calc(100% - 40px));margin-inline:auto}.nav{height:76px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);background:rgba(5,7,12,.78);backdrop-filter:blur(22px) saturate(150%)}.nav .container{height:100%;display:flex;align-items:center;gap:30px}.brand{font-size:22px;font-weight:950;letter-spacing:-1.2px;text-decoration:none}.brand b{color:var(--accent)}.links{display:flex;gap:26px;margin-right:auto}.links a{position:relative;color:var(--muted);text-decoration:none;font-size:14px;font-weight:650}.links a:hover{color:#fff}.links a:after{content:"";position:absolute;left:0;right:100%;bottom:-9px;height:2px;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:.2s}.links a:hover:after{right:0}.actions{display:flex;align-items:center;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:#fff;text-decoration:none;font-size:13px;font-weight:800;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:var(--line2);background:rgba(255,255,255,.06)}.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(110,145,255,.25)}.btn.seller{background:linear-gradient(135deg,rgba(110,145,255,.16),rgba(142,108,255,.14));border-color:rgba(130,112,255,.32)}
.hero{padding:112px 0 90px}.home-hero{position:relative;overflow:hidden}.home-hero:after{content:"";position:absolute;right:-110px;top:30px;width:520px;height:520px;border-radius:50%;background:conic-gradient(from 210deg,rgba(110,145,255,.48),rgba(67,216,255,.13),rgba(142,108,255,.38),rgba(110,145,255,.48));filter:blur(44px);opacity:.34;pointer-events:none}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;color:#a9bcff;font-size:12px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.eyebrow:before{content:"";width:28px;height:1px;background:linear-gradient(90deg,var(--accent),var(--cyan))}.hero h1{max-width:900px;margin:0;font-size:clamp(46px,7vw,84px);line-height:.98;letter-spacing:-4.5px}.hero h1 span{background:linear-gradient(90deg,#88a4ff,#66e0ff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:720px;margin:26px 0 0;color:var(--muted);font-size:18px;line-height:1.75}.hero-actions{display:flex;gap:12px;margin-top:34px}.trust-points{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.trust-points span{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:#b8c2d2;font-size:12px;font-weight:700}.section{padding:56px 0 96px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.section h2{margin:0;font-size:32px;letter-spacing:-1px}.text-link{color:#a8bbff;text-decoration:none;font-weight:800}.featured-grid,.product-grid,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.featured-card,.product-card,.card,.form-card,.info-page{border:1px solid var(--line);background:linear-gradient(145deg,rgba(18,26,40,.92),rgba(9,14,23,.94));box-shadow:0 18px 60px rgba(0,0,0,.2);border-radius:var(--radius)}.featured-card{padding:22px;transition:.22s}.featured-card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--shadow)}.featured-card h3{font-size:21px;margin:20px 0 10px}.featured-card p{color:var(--muted);line-height:1.65}.product-top,.featured-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.category-chip,.delivery-chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800}.delivery-chip{color:var(--green)}.featured-bottom{margin-top:22px}.featured-bottom strong{font-size:24px;color:#91aaff}.featured-bottom a{color:#fff;text-decoration:none;font-weight:800}.empty{grid-column:1/-1;padding:70px 24px;border:1px dashed rgba(255,255,255,.16);border-radius:var(--radius);text-align:center;color:var(--muted)}
.form-card{max-width:860px;margin:54px auto;padding:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea,.toolbar input{width:100%;border:1px solid var(--line);background:#070b12;color:#fff;border-radius:12px;padding:13px 14px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(110,145,255,.1)}.flash{padding:13px 15px;border-radius:12px;margin-bottom:18px}.flash.success{background:rgba(46,230,166,.11);color:#72f1c4;border:1px solid rgba(46,230,166,.22)}.flash.error{background:rgba(255,100,124,.1);color:#ff91a2;border:1px solid rgba(255,100,124,.22)}
.page{min-height:calc(100vh - 76px);padding:56px 0 90px}.info-page{max-width:920px;margin:0 auto;padding:46px}.info-page h1{font-size:clamp(38px,5vw,60px);letter-spacing:-2px;margin:0 0 16px}.legal-content{margin-top:32px;padding-top:28px;border-top:1px solid var(--line);color:#c6cfdd;font-size:16px;line-height:1.85;white-space:pre-wrap}.legal-meta{color:var(--muted);font-size:12px}.site-footer{border-top:1px solid var(--line);background:#070a11;padding:62px 0 28px}.footer-grid{display:grid;grid-template-columns:1.5fr repeat(2,1fr);gap:48px}.site-footer h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#fff}.site-footer a{display:block;margin:11px 0;color:var(--muted);text-decoration:none;font-size:14px}.site-footer a:hover{color:#fff}.footer-brand p{max-width:430px;color:var(--muted);line-height:1.7}.footer-bottom{margin-top:42px;padding-top:20px;border-top:1px solid var(--line);color:#6f7a8d;font-size:12px}
